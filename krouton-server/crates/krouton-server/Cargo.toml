[package]
name = "krouton-server"
description = "Krouton Server: a headless disc-burning server for the Krouton app (TLS 1.3, pinned keys, paired Macs only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "krouton-server"
path = "src/main.rs"

[dependencies]
krsp.workspace = true
server-core.workspace = true
ring.workspace = true
# TLS 1.3 only, ring backend: no C compiler beyond ring's own, no cmake/NASM on any target.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
# Self-signed P-256 certificate for the server's TLS key (generated once by `init`).
rcgen = { version = "0.13", default-features = false, features = ["ring"] }

[lints]
workspace = true
