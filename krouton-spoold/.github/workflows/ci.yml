name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]   # Linux x86_64, Intel Mac, Apple Silicon, Windows x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # The gate. No drive, network or disk needed, so it runs everywhere.
      - run: cargo run --release -p spoold-verify
      # Same suite with the accelerated hash, so both SHA-256 paths stay identical.
      - run: cargo run --release -p spoold-verify --features spoold-proto/sha2

  golden-vectors-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cryptography
      - name: Vectors on disk match a fresh run of the independent generator
        run: python3 tools/gen_golden_vectors.py | diff - vectors/krsp-golden-v1.txt

  thirty-two-bit:
    # armv7 (Raspberry Pi OS 32-bit) has a 32-bit usize; type-check that every offset stays u64.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf, aarch64-unknown-linux-gnu
      - run: cargo check --workspace --target armv7-unknown-linux-gnueabihf
      - run: cargo check --workspace --target aarch64-unknown-linux-gnu
