[package]
name = "krouton-spoold"
description = "Headless remote disc-burning server for Krouton (mTLS, pinned client certs)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Targets: x86_64-apple-darwin (macOS 12 Intel), aarch64-apple-darwin,
# i686-pc-windows-msvc / x86_64-pc-windows-msvc (Windows 10),
# aarch64-unknown-linux-gnu / armv7-unknown-linux-gnueabihf (Raspberry Pi OS 64/32-bit),
# x86_64-unknown-linux-gnu (Debian).

[dependencies]
spoold-core = { path = "../spoold-core" }
# TLS 1.3 only, ring backend (no cmake/NASM needed on any target).
rustls = { version = "0.23.20", default-features = false, features = ["ring", "std", "logging"] }
# Same crate rustls already uses; we call it directly for SHA-256 (pins and image integrity).
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"                       # statvfs for the free-space check

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Generates throwaway certificates for the TLS integration test.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
