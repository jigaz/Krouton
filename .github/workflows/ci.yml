name: Krouton CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-macos:
    # Xcode 27.2 / Swift 6.4, the toolchain Krouton is developed on (Scripts/ci-select-xcode.sh).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 27.2 and Swift 6.4
        run: Scripts/ci-select-xcode.sh 27.2
      - name: Manual on krouton.app matches the app's manual
        run: python3 Scripts/build-manual.py --check
      - name: String Catalog has every interface string
        run: python3 Scripts/extract-strings.py --check
      - name: String Catalog compiles
        run: |
          out="$(mktemp -d)"
          xcrun xcstringstool compile Sources/KroutonApp/Resources/Localizable.xcstrings --output-directory "$out"
          ls "$out"
          test -f "$out/zh-Hans.lproj/Localizable.strings"
      - name: Build All Targets
        run: swift build
      - name: Run Unit Tests
        run: swift test
      - name: Run Deterministic Verification Harness
        run: swift run krouton-verify
        env:
          KROUTON_HFS_OUT: ${{ runner.temp }}/hfs
      - name: An independent reader checks the classic HFS image (Suite 38)
        run: python3 Scripts/check-hfs-image.py "$RUNNER_TEMP/hfs/classic.cdr"
      - name: Keep the classic HFS image for the Linux mount
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hfs-image
          path: ${{ runner.temp }}/hfs/classic.cdr
          if-no-files-found: ignore

  string-catalog-format-keys:
    # SwiftUI looks up Text("STEP \(n) OF \(count)") under "STEP %lld OF %lld", with a specifier
    # chosen by each value's type. extract-strings.py guesses the types; swiftc knows them. Build
    # the app with -emit-localized-strings (what Xcode does for its catalogs) and fail if the
    # compiler looks up a format key the catalog doesn't have.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 27.2 and Swift 6.4
        run: Scripts/ci-select-xcode.sh 27.2
      - name: Build the app and write the keys it looks up
        run: |
          swift build --product Krouton \
            -Xswiftc -emit-localized-strings \
            -Xswiftc -emit-localized-strings-path -Xswiftc "$RUNNER_TEMP/loc-strings"
          find "$RUNNER_TEMP/loc-strings" -name '*.stringsdata' | wc -l
      - name: The catalog has every format key swiftc looks up
        run: python3 Scripts/extract-strings.py --check --compiler-strings "$RUNNER_TEMP/loc-strings"

  avchd-real-encode:
    # The AVCHD pipeline end to end: ffmpeg makes two test clips (30 and 25 fps, stereo and 5.1),
    # krouton-verify Suite 36 converts, authors and images them, then libbluray (what VLC, Kodi
    # and mpv play Blu-rays with) opens the folder and the UDF 2.50 image, reads the title, clips
    # and chapters and seeks through the EP map, and hdiutil mounts the image.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 27.2 and Swift 6.4
        run: Scripts/ci-select-xcode.sh 27.2
      - name: ffmpeg and libbluray
        run: brew install ffmpeg libbluray
      - name: Test clips
        run: |
          mkdir -p "$RUNNER_TEMP/avchd"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 12 -c:v libx264 -pix_fmt yuv420p -c:a aac -ac 2 "$RUNNER_TEMP/avchd/a.mp4"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=25 -f lavfi -i sine=frequency=330:sample_rate=48000 \
            -t 8 -c:v libx264 -pix_fmt yuv420p -c:a aac -ac 6 "$RUNNER_TEMP/avchd/b.mov"
      - name: Convert, author and image them (Suite 36)
        run: swift run krouton-verify
        env:
          KROUTON_AVCHD_INPUTS: ${{ runner.temp }}/avchd/a.mp4,${{ runner.temp }}/avchd/b.mov
          KROUTON_AVCHD_OUT: ${{ runner.temp }}/avchd/out
      - name: libbluray reads the disc; macOS mounts the image
        run: python3 Scripts/check-avchd-disc.py "$RUNNER_TEMP/avchd/out"
      - name: macOS mounts the DVD-Video image and lists VIDEO_TS in order
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mnt" "$RUNNER_TEMP/avchd/out/dvd-vector.iso"
          ls -l "$mnt/VIDEO_TS"
          test -f "$mnt/VIDEO_TS/VTS_01_1.VOB"
          cmp <(head -c 300000 "$mnt/VIDEO_TS/VTS_01_1.VOB") <(python3 -c "import sys; sys.stdout.buffer.write(bytes(((i*31+12)&255) for i in range(300000)))")
          hdiutil detach "$mnt"
      - name: Keep the DVD-Video image when the vector fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: dvd-vector
          path: ${{ runner.temp }}/avchd/out/dvd-vector.iso


  unused-code:
    # A report, not a gate: Periphery lists declarations nothing uses, from the compiler's index.
    runs-on: xcode-27
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 27.2 and Swift 6.4
        run: Scripts/ci-select-xcode.sh 27.2
      - name: Install Periphery
        run: brew install periphery && periphery version
      - name: Scan
        # Swift 6.4's build puts the index store somewhere Periphery no longer looks, so build
        # first and point Periphery at the store the build wrote.
        run: |
          swift build
          store=$(find .build -type d -path '*index/store' | head -n 1)
          echo "Index store: $store"
          periphery scan --skip-build --index-store-path "$store" --format csv --quiet > periphery.csv
      - name: Summary
        if: always()
        run: python3 Scripts/periphery-summary.py periphery.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: periphery-report
          path: periphery.csv

  hfs-linux-mount:
    # Linux's own HFS driver mounts the classic HFS image Suite 38 wrote (macOS can't read
    # HFS Standard any more), and the files read back as written.
    needs: verify-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: hfs-image
      - name: Mount and read it
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || true
          sudo modprobe hfs
          sudo mkdir -p /mnt/hfs
          sudo mount -t hfs -o loop,ro,offset=32768 classic.cdr /mnt/hfs
          ls -laR /mnt/hfs
          printf 'Read me first\r' | cmp - '/mnt/hfs/Read Me'
          test "$(stat -c %s '/mnt/hfs/System Folder/Extensions/apple Ext')" = 70000
          sudo umount /mnt/hfs

  ipados-portable-core:
    # The libraries an iPad app would share (krouton-verify Suite 31) must compile for iPadOS.
    # NetworkSpool pulls in OpticalCore; LabelKit pulls in AudioKit and RescueKit.
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        scheme: [ NetworkSpool, LabelKit, Persistence ]
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 27.2 and Swift 6.4
        run: Scripts/ci-select-xcode.sh 27.2
      - name: Build ${{ matrix.scheme }} for iPadOS
        run: |
          xcodebuild -scheme '${{ matrix.scheme }}' -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && status=0 || status=$?
          grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)' build.log | sort -u | head -n 80
          exit "$status"
