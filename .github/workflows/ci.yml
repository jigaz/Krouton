name: Krouton macOS CI & Architecture Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Krouton App & CLI
        run: swift build --product Krouton
      - name: Smoke-Test Headless CLI
        run: |
          .build/debug/Krouton --version
          .build/debug/Krouton formats --json | head -n 20
      - name: Run 22-Suite Invariant Gate (krouton-verify)
        run: swift run krouton-verify
      - name: Run Unit Test Targets
        run: swift test
