name: Krouton CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-macos:
    # Matches the toolchain Krouton is developed on (Xcode 26 / Swift 6.2 SDK annotations).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Manual on krouton.app matches the app's manual
        run: python3 Scripts/build-manual.py --check
      - name: Build All Targets
        run: swift build
      - name: Run Unit Tests
        run: swift test
      - name: Run Deterministic Verification Harness
        run: swift run krouton-verify

  ipados-portable-core:
    # The libraries an iPad app would share (krouton-verify Suite 31) must compile for iPadOS.
    # NetworkSpool pulls in OpticalCore; LabelKit pulls in AudioKit and RescueKit.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        scheme: [ NetworkSpool, LabelKit, Persistence ]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.scheme }} for iPadOS
        run: |
          xcodebuild -scheme '${{ matrix.scheme }}' -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && status=0 || status=$?
          grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)' build.log | sort -u | head -n 80
          exit "$status"
