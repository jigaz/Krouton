name: Krouton CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-macos:
    # Matches the toolchain Krouton is developed on (Xcode 26 / Swift 6.2 SDK annotations).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build All Targets
        run: swift build
      - name: Run Unit Tests
        run: swift test
      - name: Run Deterministic Verification Harness
        run: swift run krouton-verify
