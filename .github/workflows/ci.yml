name: Krouton CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-macos:
    # Matches the toolchain Krouton is developed on (Xcode 26 / Swift 6.2 SDK annotations).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build All Targets
        run: swift build
      - name: Run Unit Tests
        run: swift test
      - name: Run Deterministic Verification Harness
        run: swift run krouton-verify
      - name: Probe IOKit SCSITaskLib for the direct-access prototype (temporary)
        continue-on-error: true
        run: |
          H="$(xcrun --show-sdk-path)/System/Library/Frameworks/IOKit.framework/Headers/scsi"
          ls "$H"
          grep -nE 'CFUUIDGetConstantUUIDWithBytes|^#define kIO.*(TypeID|InterfaceID)' -A3 "$H/SCSITaskLib.h" | head -n 120
          grep -nE 'typedef struct MMCDeviceInterface|^\s+(IOReturn|Boolean|SCSITaskDeviceInterface).*\(\s*\*\s*[A-Za-z]+' "$H/SCSITaskLib.h" | head -n 120
          printf 'import IOKit\nimport IOKit.scsi\nlet a = MemoryLayout<MMCDeviceInterface>.size\nlet b = MemoryLayout<SCSITaskDeviceInterface>.size\nlet c = MemoryLayout<SCSITaskInterface>.size\nprint(a, b, c)\n' > /tmp/probe.swift
          swiftc /tmp/probe.swift -o /tmp/probe && /tmp/probe || echo "IOKit.scsi probe did not compile"
          printf 'import IOKit\nlet a = MemoryLayout<MMCDeviceInterface>.size\nprint(a)\n' > /tmp/probe2.swift
          swiftc /tmp/probe2.swift -o /tmp/probe2 && /tmp/probe2 || echo "plain IOKit probe did not compile"

  ipados-portable-core:
    # The libraries an iPad app would share (krouton-verify Suite 31) must compile for iPadOS.
    # NetworkSpool pulls in OpticalCore; LabelKit pulls in AudioKit and RescueKit.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        scheme: [ NetworkSpool, LabelKit, Persistence ]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.scheme }} for iPadOS
        run: |
          xcodebuild -scheme '${{ matrix.scheme }}' -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && status=0 || status=$?
          grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)' build.log | sort -u | head -n 80
          exit "$status"
