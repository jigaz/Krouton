name: Krouton CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build All Targets
        run: swift build
      - name: Run Unit Tests
        run: swift test
      - name: Run Deterministic Verification Harness
        run: swift run krouton-verify
