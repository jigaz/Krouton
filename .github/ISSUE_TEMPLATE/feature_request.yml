name: Feature request
description: Suggest something Krouton or Krouton Server should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before you start, check the open issues and `dev-notes/open-questions.md`; the idea may already be there.
        To ask for a disc format, use the format request form instead.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, from the point of view of someone using it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you've tried
      description: Workarounds, other apps, or other designs you considered.
  - type: dropdown
    id: component
    attributes:
      label: Part of Krouton
      options:
        - The app
        - The krouton command or Shortcuts
        - Krouton Server
        - The manual or the website
        - Building or contributing
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Helping
      options:
        - label: I'd like to work on this myself.
